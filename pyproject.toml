# Project Configurations #
[project]
# Project Details
name = "baseobjects"
description = "Basic object templates."
dynamic = ["version", "readme"]  # Get the version and readme from the tool.poetry section
classifiers = ["Development Status :: 4 - Beta", ]

# Staff
authors = [{name = "Anthony Fong", email = "FongAnthonyM@gmail.com"},]
maintainers = [{name = "Anthony Fong", email = "FongAnthonyM@gmail.com"},]

# License
license = "MIT"
license-files = ["LICENSE.rst"]

# Package Dependencies
requires-python = ">=3.10"  # Upper bound defined in tool.poetry.dependencies
dependencies = [
    "bidict>=0.22.0",
]

# URLs
[project.urls]
homepage = "https://github.com/AnthonyTechnologies/python-baseobjects"
repository = "https://github.com/AnthonyTechnologies/python-baseobjects"
documentation = "https://python-baseobjects.readthedocs.io"
changelog = "https://github.com/AnthonyTechnologies/python-baseobjects/releases"

# Optional Dependencies
[project.optional-dependencies]
dev = [
    "bandit>=1.7.4",
    "black>=21.10b0",
    "coverage[toml]>=6.2",
    "click>=8.0.3",
    "darglint>=1.8.1",
    "flake8>=4.0.1",
    "flake8-bugbear>=21.9.2",
    "flake8-docstrings>=1.6.0",
    "flake8-rst-docstrings>=0.2.5",
    "furo>=2021.11.12",
    "isort>=5.10.1",
    "mypy>=0.930",
    "nox>=2025.5.1",
    "nox-poetry>=1.2.0",
    "pep8-naming>=0.12.1",
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "Pygments>=2.10.0",
    "pytest>=6.2.5",
    "pyupgrade>=2.29.1",
    "ruff>=0.14.0",
    "safety>=1.10.3",
    "sphinx>=4.3.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-click>=3.0.2",
    "sphinx-rtd-theme>=3.0.2",
    "typeguard>=2.13.3",
    "xdoctest[colors]>=0.15.10",
    "myst-parser>=0.16.1",
]
jupyter = [
    "jupyter>=1.1.1",
]


# Project Build
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# Poetry
[tool.poetry]
version = "1.12.0"
readme = ["README.rst"]
packages = [
    { include = "baseobjects", from = "src" },
]

# Lock Dependencies
[tool.poetry.dependencies]
python = ">=3.11, <4.0"
bidict = ">=0.22.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


# Development Configurations
# Coverage
[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["baseobjects"]

[tool.coverage.report]
show_missing = true
fail_under = 100


# MYPY
[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true


# Ruff
[tool.ruff]
preview = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "examples",
    "tests",
    "tutorials",
    "docs",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "EM",
    "PIE",
    "PT",
    "Q",
    "RSE",
    "RET",
    "PTH",
    "N",
    "E",
    "W",
    "DOC",
    "D",
    "F",
    "UP",
    "RUF",
]
ignore = [
    "ANN401",
    "S101",
    "S301",
    "S403",
    "B024",
    "B027",
    "A003",
    "A005",
    "RET505",
    "E501",
    "D205",
    "D415",
    "F401",
    "F403",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
indent-style = "space"  # Python convention, use spaces rather than tabs
line-ending = "auto"  # Detect Line ending
skip-magic-trailing-comma = false  # Comma used at the end of multi-line lists
quote-style = "double"  # Like C++ double quotes for strings and single for char
docstring-code-format = false  # Format code in docstrings
docstring-code-line-length = "dynamic"

# isort [Import Sorting]
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
import_heading_stdlib = "Standard Libraries #"
import_heading_thirdparty = "Third-Party Packages #"
import_heading_firstparty = "Source Packages #"
import_heading_localfolder = "Local Packages #"
